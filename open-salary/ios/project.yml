# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: OpenSalary
options:
  bundleIdPrefix: dev.bimalpaul
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Where the app reads data. The simulator reaches a Mac-hosted dev server at localhost.
    # For a device or release build, point this at the deployed web app.
    OS_API_BASE_URL: "http://localhost:3000"
targets:
  OpenSalary:
    type: application
    platform: iOS
    sources:
      - path: OpenSalary
    info:
      path: OpenSalary/Resources/Info.plist
      properties:
        CFBundleDisplayName: Open Salary
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        OSAPIBaseURL: $(OS_API_BASE_URL)
        NSAppTransportSecurity:
          # Plain http is allowed only for local addresses (the dev server).
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bimalpaul.opensalary
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OpenSalaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenSalaryTests
    dependencies:
      - target: OpenSalary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenSalary:
    build:
      targets:
        OpenSalary: all
        OpenSalaryTests: [test]
    test:
      targets: [OpenSalaryTests]
